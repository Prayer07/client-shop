
[functions.subscribe-beehiiv]
enabled = true
verify_jwt = true
import_map = "./functions/subscribe-beehiiv/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/subscribe-beehiiv/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/subscribe-beehiiv/*.html" ]

[functions.send-newsletter]
enabled = true
verify_jwt = false
import_map = "./functions/send-newsletter/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-newsletter/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-newsletter/*.html" ]
